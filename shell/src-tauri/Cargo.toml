[package]
name = "lumi-shell"
version = "0.0.0"
description = "Lumi Shell — Desktop shell holding only OS privilege primitives"
authors = ["Lumi contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lumi_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `protocol-asset`: Allow WebView to read Content Pack assets (ADR-029)
# **The readable scope is determined at runtime by Shell** -> src/content_pack.rs
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
rand = "0.9.5"
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Globalization"] }

[profile.release]
# Limited effect (measured: the code portion shrinks by about 1 MB). **MSVC
# emits debug info to a .pdb**, so `strip` doesn't dramatically shrink the
# exe. What dominated the installer size was assets that had crept into the
# frontend → docs/measurements/phase0.md
# `panic = "abort"` is not set. Shell is responsible for "rejection," so
# **even if it does go down, unwinding on the way down is preferable** (killing unwind also skips Drop).
strip = "symbols"
lto = true
codegen-units = 1

[lints.clippy]
# Shell holds only "rejection." Panicking would make it unable to reject,
# so unwrap / expect are avoided as a rule (the only exception is startup-sequence initialization).
unwrap_used = "warn"
