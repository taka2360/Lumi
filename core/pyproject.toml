[project]
name = "lumi-core"
version = "0.0.0"
description = "Lumi Core — AI Core holding authority (decisions, state, policy, memory)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "websockets>=13.0",
    "structlog>=24.4.0",
    "sqlite-vec>=0.1.9",
    # Phase 2. **Encryption at rest** for the memory / event / audit DBs (ADR-038, ADR-040).
    # SQLite3 Multiple Ciphers (MIT) built into APSW (any-OSI). **Replaces the stdlib
    # `sqlite3` driver**: the stdlib module cannot open an encrypted database
    "apsw-sqlite3mc>=3.53.4.0",
    "httpx>=0.28.1",
    "sounddevice>=0.5.5",
    # Phase 1. Audio is handled as a 16kHz mono float32 array (the shared representation for VAD / STT)
    "numpy>=2.1",
    # Phase 1. STT. **CTranslate2 / int8. Doesn't depend on torch** (R1)
    "faster-whisper>=1.1",
    # Phase 1 (Silero VAD) and Phase 2e (embeddings). **Declared, not inherited**: both
    # arrive transitively through faster-whisper today, and Core imports them directly —
    # a Core that only works because of another package's dependency list is one that
    # breaks the day that list changes
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

# Doesn't depend on torch (installer size R1).
# When adding a dependency, only add ones listed in docs/DESIGN.md §7's technology selection.

[project.scripts]
lumi-core = "lumi.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyinstaller>=6.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# User-facing strings, log messages, and error messages stay in Japanese
# (.claude/rules/01-design-process.md — comments/docstrings are English, but
# these aren't). The rule that flags fullwidth brackets etc. as "ambiguous
# characters" is disabled since it conflicts with that.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["lumi", "tests"]

# External libraries without type stubs. **Listed individually** (never ignored wholesale).
[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "sounddevice.*", "faster_whisper.*", "onnxruntime.*", "ctranslate2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
