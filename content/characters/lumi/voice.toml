# Voice settings and credits
#
# **Content Packs without [credit] are not loaded** (fail-closed)
# Attribution is an obligation under voice terms of use that cannot be added retroactively
# (docs/architecture/extension.md §9 / docs/licensing.md §6)
#
# Engine-side attribution lives in Provider.attribution(), not here
# This is because **the Content Pack chooses the model, while the Provider decides the engine**

[voice]
# Omitting speaker = uses the engine's default speaker
# The default speaker is not hardcoded because installed models in AivisSpeech vary by environment
# When specifying a specific model, replace the speaker ID and credit here
volume = 0.1

[credit]
name = "AivisSpeech default voice synthesis model"
credit_text = "Voice: AivisSpeech (default voice synthesis model)"
license_name = "Aivis Common Model License (ACML) 1.0"
license_url = "https://hub.aivis-project.com/"
# license_file is empty because **the model is not bundled** (the engine fetches it at runtime)
# If bundled, the full license text must be placed in LICENSE/ and its path specified here
license_file = ""
